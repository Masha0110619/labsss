model_family: scale_invariant
features:
  numeric_continuous:
  - WarehouseToHome
  - OrderAmountHikeFromlastYear
  - reviewer_age
  numeric_discrete:
  - HourSpendOnApp
  - NumberOfDeviceRegistered
  - NumberOfAddress
  - review_rating
  binary_flag:
  - Complain
  categorical_nominal:
  - PreferredLoginDevice
  - PreferredPaymentMode
  - PreferedOrderCat
  - MaritalStatus
  - review_department
  categorical_ordinal:
  - SatisfactionScore
  interaction_numeric: &id001
  - Tenure
  - OrderCount
  - CashbackAmount
  - DaySinceLastOrder
  - CouponUsed
  purchase_time:
  - last_purchase_hour
  - last_purchase_weekday
  - last_purchase_month
  high_cardinality:
  - clothing_id
  - retail_country
protected_attributes:
- CityTier
- Gender
group_kinds:
  numeric_continuous: numeric
  numeric_discrete: numeric
  binary_flag: numeric
  categorical_nominal: categorical
  categorical_ordinal: categorical
  interaction_numeric: numeric
  purchase_time: numeric
  high_cardinality: categorical
imputation_policy:
  numeric:
  - max_share: 0.1
    strategy: median
  - max_share: 0.4
    strategy: median
    add_indicator: true
  - max_share: 1.0
    strategy: constant
    fill_value: 0
    add_indicator: true
  categorical:
  - max_share: 0.1
    strategy: most_frequent
  - max_share: 1.0
    strategy: constant
    fill_value: Missing
  text:
  - max_share: 1.0
    strategy: constant
    fill_value: ''
  scale_sensitive:
    numeric:
    - max_share: 0.1
      strategy: median
      add_indicator: true
    - max_share: 0.4
      strategy: median
      add_indicator: true
    - max_share: 1.0
      strategy: constant
      fill_value: 0
      add_indicator: true
transform_policy:
  scale_sensitive:
    numeric_continuous:
    - yeo_johnson
    - robust_scaler
    numeric_discrete:
    - robust_scaler
    binary_flag:
    - passthrough
    categorical_nominal:
    - frequency_encoder
    - standard_scaler
    categorical_ordinal:
    - ordinal_encoder
    - min_max_scaler
    interaction_numeric:
    - pairwise_products:
        columns: *id001
    - yeo_johnson_std
    purchase_time:
    - periodic_spline:
        periods:
          last_purchase_hour: 24
          last_purchase_weekday: 7
          last_purchase_month: 12
    high_cardinality:
    - target_encoder:
        min_frequency: 5
        cv: 5
  scale_invariant:
    numeric_continuous:
    - quantile_bins:
        n_bins: 8
    numeric_discrete:
    - passthrough
    binary_flag:
    - passthrough
    categorical_nominal:
    - ordinal_encoder
    categorical_ordinal:
    - ordinal_encoder
    interaction_numeric:
    - pairwise_products:
        columns: *id001
    purchase_time:
    - passthrough
    high_cardinality:
    - target_encoder:
        min_frequency: 5
        cv: 5
experiment:
  test_size: 0.3
  random_state: 42
  threshold: 0.5
  models:
    lr: LogisticRegression(max_iter=1000)
    rf: RandomForestClassifier(n_estimators=200, random_state=42)
fairness:
  protected: CityTier
  privileged: 1
  unprivileged: 3
  favourable_label: 1
selection:
  spearman_threshold: 0.9
  k_filter: 40
  k_wrapper:
  - 10
  - 20
  l1_ratio: 0.5
  C: 0.5
splitter_6b:
  type: StratifiedKFold
  n_splits: 5
  shuffle: true
  random_state: 42
  note: зовнішній спліттер для вкладеної CV ЛР №3
