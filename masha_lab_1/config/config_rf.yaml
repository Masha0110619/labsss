model_family: scale_invariant

features:
  numeric_continuous: [Tenure, WarehouseToHome, CashbackAmount, OrderAmountHikeFromlastYear, DaySinceLastOrder]
  numeric_discrete: [HourSpendOnApp, NumberOfDeviceRegistered, NumberOfAddress, CouponUsed, OrderCount]
  binary_flag: [Complain]
  categorical_nominal: [PreferredLoginDevice, PreferredPaymentMode, PreferedOrderCat, MaritalStatus]
  categorical_ordinal: [SatisfactionScore]

protected_attributes: [CityTier, Gender]

group_kinds:
  numeric_continuous: numeric
  numeric_discrete: numeric
  binary_flag: numeric
  categorical_nominal: categorical
  categorical_ordinal: categorical

imputation_policy:
  numeric:
    - {max_share: 0.10, strategy: median}
    - {max_share: 0.40, strategy: median, add_indicator: true}
    - {max_share: 1.00, strategy: constant, fill_value: 0, add_indicator: true}
  categorical:
    - {max_share: 0.10, strategy: most_frequent}
    - {max_share: 1.00, strategy: constant, fill_value: Missing}
  scale_sensitive:
    numeric:
      - {max_share: 0.10, strategy: median, add_indicator: true}
      - {max_share: 0.40, strategy: median, add_indicator: true}
      - {max_share: 1.00, strategy: constant, fill_value: 0, add_indicator: true}

transform_policy:
  scale_sensitive:
    numeric_continuous: [yeo_johnson, robust_scaler]
    numeric_discrete: [robust_scaler]
    binary_flag: [passthrough]
    categorical_nominal: [frequency_encoder, standard_scaler]
    categorical_ordinal: [ordinal_encoder, min_max_scaler]
  scale_invariant:
    numeric_continuous: [{quantile_bins: {n_bins: 8}}]
    numeric_discrete: [passthrough]
    binary_flag: [passthrough]
    categorical_nominal: [ordinal_encoder]
    categorical_ordinal: [ordinal_encoder]
